<!--
  CLRC プレイヤー サンプル

  ■ カスタマイズ方法（用意するのは「動画ID」と「clrcファイル」だけ）
    1. data-video-id に YouTube の動画ID（または動画のURL）を書く
       （clrc ファイルに [yt:動画ID] を書いている場合は省略できます。両方ある場合は data-video-id を優先します）
    2. 歌詞は次のどちらかで指定する
       A. 下の <script type="text/plain"> ～ </script> の間に clrc ファイルの中身を貼り付ける
       B. clrc ファイルをサーバーに置き、data-src="ファイル名.clrc" を書く
          （例: <div class="clrc-player" data-video-id="PPSNnYSKkYs" data-src="sample.clrc"></div>）
          ※ HTML をパソコン上で直接開いた場合、B は動きません。A を使ってください。
    3. clrc ファイルの書き方は spec.md を参照

  ■ 書き間違いを確認したいとき
    data-debug="true" を付けると、clrc ファイルの警告が歌詞の下に表示されます。

  ■ 1ページに複数の動画を置く場合
    <div class="clrc-player" ...> ～ </div> を必要な数だけ並べます。
    <script src=...> の2行はページに1回だけ書けば十分です。
-->
